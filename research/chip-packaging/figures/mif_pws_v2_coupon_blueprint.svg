<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360">
  <rect width="800" height="360" fill="#f8fafc" stroke="#0f172a" stroke-width="2"/>
  <text x="400" y="28" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#0f172a">
    MIF-PWS v2 BENCHTOP FALSIFICATION COUPON BLUEPRINT [MODEL-ONLY / NOT PHYSICALLY FABRICATED]
  </text>
  <text x="400" y="48" font-family="sans-serif" font-size="11.5" text-anchor="middle" fill="#475569">
    45.0 x 45.0 mm Active Zone | 60 Counter-Flow Channels (p = 0.75 mm, 120 Split Passes) | 8x8 Kerf-Slotted Cu-Mo-Cu Bridge (5.625 mm Pitch)
  </text>
  <rect x="55" y="70" width="320" height="250" fill="#e2e8f0" stroke="#0f172a" stroke-width="1.5"/>
  <text x="215" y="92" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#0f172a">
    COAXIAL-GROUNDED FIN &amp; KERF DETAIL
  </text>
  <rect x="85" y="110" width="260" height="38" fill="#0284c7" stroke="#0f172a" stroke-width="1.2"/>
  <text x="215" y="133" font-family="sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#ffffff">
    Post-Metrology Maskless Dogbone RDL + eFuse Array
  </text>
  <rect x="85" y="148" width="260" height="44" fill="#d97706" stroke="#78350f" stroke-width="1.2"/>
  <text x="215" y="174" font-family="sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#ffffff">
    Slotted Cu-Mo-Cu CTE Bridge (5.8 ppm/K, 5.625 mm Kerfs)
  </text>
  <rect x="85" y="192" width="260" height="75" fill="#1e293b" stroke="#0f172a" stroke-width="1.2"/>
  <text x="215" y="224" font-family="sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#fde047">
    60 Counter-Flow Channels + Coaxial Insulated Vdd Cores
  </text>
  <text x="215" y="246" font-family="sans-serif" font-size="9.5" text-anchor="middle" fill="#ffffff">
    100% Wetted Walls at 0.0 V Ground | R_PDN = 0.004 mOhm
  </text>
  <rect x="415" y="70" width="335" height="250" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
  <text x="582" y="92" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#0f172a">
    MINIMAL EXTERNAL FALSIFICATION EXPERIMENT
  </text>
  <text x="430" y="122" font-family="sans-serif" font-size="10.5" fill="#0f172a">
    1. Coupon: 4x4 Cu-Mo-Cu kerf-slotted heater array + coaxial fin base
  </text>
  <text x="430" y="148" font-family="sans-serif" font-size="10.5" fill="#0f172a">
    2. Thermal Test: 1,000 W load + 95% Header A blockage -&gt; Overturn if
  </text>
  <text x="445" y="166" font-family="sans-serif" font-size="10.5" font-weight="bold" fill="#dc2626">
    measured Tj &gt; 75.0 C (Simulated: 60.6 C) or dP_clean &gt; 68 kPa
  </text>
  <text x="430" y="192" font-family="sans-serif" font-size="10.5" fill="#0f172a">
    3. Electrical PDN Test: 1,280 A DC injection -&gt; Overturn if vertical
  </text>
  <text x="445" y="210" font-family="sans-serif" font-size="10.5" font-weight="bold" fill="#dc2626">
    PDN Joule loss &gt; 18.0 W (Simulated: 6.7 W) or leakage &gt; 10 uA
  </text>
  <text x="430" y="236" font-family="sans-serif" font-size="10.5" fill="#0f172a">
    4. CTE Cycling Test: 500 cycles (-10 C to +85 C) -&gt; Overturn if
  </text>
  <text x="445" y="254" font-family="sans-serif" font-size="10.5" font-weight="bold" fill="#dc2626">
    acoustic/X-ray bond delamination &gt; 2% area or R_th drift &gt; 8%
  </text>
  <text x="430" y="286" font-family="sans-serif" font-size="10" fill="#475569">
    Estimated Unquoted Benchtop Experiment Cost: ~$6,400 (Zero Ordered)
  </text>
</svg>