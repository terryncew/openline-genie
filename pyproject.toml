[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "openline-genie"
version = "0.7.1"
description = "OpenLine Genie Living World v0.7.1 — Local-First Visual Project Builder & Constraint Engine"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
classifiers = [
    "License :: OSI Approved :: Apache Software License",
]
dependencies = [
    "cryptography>=41.0.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
browser = [
    "playwright>=1.40.0",
]
