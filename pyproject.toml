[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "openline-genie"
version = "1.2.0rc2"
description = "OpenLine Genie & Living Projects v1.2.0-rc2 — Seven-Application Local-First Suite & Receiver-Governed Runtime"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
classifiers = [
    "License :: OSI Approved :: Apache Software License",
]
dependencies = [
    "cryptography>=41.0.0",
    "numpy>=1.26.0",
    "onnxruntime>=1.16.0",
]

[project.optional-dependencies]
browser = [
    "playwright>=1.40.0",
    "selenium>=4.15.0",
]
